name: Build NetHunter Kernel for GTA4XWiFi

on:
  workflow_dispatch:          # manual trigger (add `push:` if you want auto‑run)
  # push:
  #   branches: [ main, master ]

env:
  # -------------------------------------------------
  # 1️⃣ Device & build configuration
  # -------------------------------------------------
  DEVICE_CODENAME: gta4xwifi
  KERNEL_SOURCE: https://github.com/LineageOS/kernel-msm   # mirror (see note below)
  KERNEL_BRANCH: sec(α).03.00                # <-- quoted in the clone step
  KERNEL_CONFIG: GTA4XWiFi_defconfig
  NET_HUNTER_PATCHES: https://github.com/nethunter-project/nethunter-kernel-patches/archive/refs/heads/master.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the project (includes device trees, patches, etc.)
        uses: actions/checkout@v4

      - name: 🐧 Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev libelf-dev libncurses5-dev xz-utils \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf tmux curl zip unzip

      - name: 📦 Clone kernel sources (quoted branch)
        run: |
          # The branch name contains parentheses & a Greek letter – quoting prevents
          # Bash from interpreting them as part of an arithmetic expression.
          git clone --recursive --branch "${{ env.KERNEL_BRANCH }}" ${{ env.KERNEL_SOURCE }} kernel --depth=1

      - name: 📂 Copy device‑tree & defconfig
        run: |
          mkdir -p kernel/arch/arm64/boot/dts/samsung/
          cp device/samsung/${{ env.DEVICE_CODENAME }}/dt/*.dtsi kernel/arch/arm64/boot/dts/samsung/ || true
          cp device/samsung/${{ env.DEVICE_CODENAME }}/${{ env.KERNEL_CONFIG }} kernel/.config

      - name: 📜 Apply NetHunter patches
        run: |
          cd kernel
          curl -L ${{ env.NET_HUNTER_PATCHES }} -o patches.zip
          unzip patches.zip
          git apply nethunter-kernel-patches-master/*.patch || true

      - name: ⚙️ Build kernel, dtbs & modules
        run: |
          cd kernel
          make -j$(nproc) O=out ${{ env.KERNEL_CONFIG }}
          make -j$(nproc) O=out dtbs
          make -j$(nproc) O=out modules
          make -j$(nproc) O=outImage INSTALL_MOD_PATH=modules modules_install
          zip -r kernel-build.zip out/arch/arm64/boot/Image out/arch/arm64/boot/dts/samsung/*.dtb out/lib

      - name: 📤 Upload kernel artefacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE_CODENAME }}
          path: kernel/kernel-build.zip
          retention-days: 7

      - name: 📦 Package with AnyKernel3
        run: |
          cd kernel
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image anykernel/
          cd anykernel
          # Minimal AnyKernel3 tweaks
          sed -i 's/kernel.string=.*/kernel.string=Custom NetHunter Kernel/g' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=0/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=gta4xwifi/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=gta4xl/g' anykernel.sh
          sed -i 's|^block=.*|block=auto|g' anykernel.sh
          zip -r9 ../AnyKernel3-gta4xlwifi-NetHunter.zip *
          echo "✅ AnyKernel3 zip ready"

      - name: 🚀 Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-gta4xlwifi-NetHunter
          path: kernel/AnyKernel3-gta4xlwifi-NetHunter.zip

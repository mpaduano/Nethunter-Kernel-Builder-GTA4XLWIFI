name: Build NetHunter Kernel for GTA4XWiFi

# Run on push to main/master or on a manual trigger
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # ----- USER‑CONFIGURABLE -----
  DEVICE codename: gta4xwifi            # <-- change only if you rename the folder
  KERNEL_SOURCE: https://source.codeaurora.org/quic/kernel/msm   # Stock Samsung kernel
  KERNEL_BRANCH: sec(α).03.00          # Latest stable branch for this device
  KERNEL_CONFIG: GTA4XWiFi_defconfig   # Name of the defconfig file (see device/…)
  NET_HUNTER_PATCHES: |
    https://github.com/nethunter-project/nethunter-kernel-patches/archive/refs/heads/master.zip
  # --------------------------------

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐧 Set up Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            xz-utils \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            tmux \
            curl \
            zip \
            unzip

      - name: 📦 Clone kernel sources
        run: |
          git clone --depth 1 --branch ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel
          cd kernel
          # Checkout the exact commit that matches the device tree
          git checkout ${{ secrets.KERNEL_COMMIT }} || true   # optional: set secret if needed

      - name: 📂 Copy device‑specific tree & config
        run: |
          mkdir -p kernel/arch/arm64/boot/dts/samsung/
          cp device/samsung/${{ env.DEVICE }}/dt/*.dtsi kernel/arch/arm64/boot/dts/samsung/ || true
          cp device/samsung/${{ env.DEVICE }}/${{ env.KERNEL_CONFIG }} kernel/.config

      - name: 📜 Apply NetHunter patches
        run: |
          cd kernel
          curl -L ${{ env.NET_HUNTER_PATCHES }} -o patches.zip
          unzip patches.zip
          git apply nethunter-kernel-patches-master/*.patch || true   # skip if none apply

      - name: ⚙️ Build kernel & modules
        run: |
          cd kernel
          make -j$(nproc) O=out ${{ env.KERNEL_CONFIG }}
          make -j$(nproc) O=out dtbs
          make -j$(nproc) O=out modules
          # Package the final image
          make -j$(nproc) O=outImage INSTALL_MOD_PATH=modules modules_install
          zip -r kernel‑build.zip out/arch/arm64/boot/Image out/arch/arm64/boot/dts/samsung/*.dtb out/lib

      - name: 📤 Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: kernel‑gta4xwifi
          path: kernel/kernel‑build.zip

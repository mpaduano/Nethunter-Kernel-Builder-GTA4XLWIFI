name: "Build kernels"

env:
  CONFIGURATION: "repos.json"
  OUT_DIR: "out"

on:
  workflow_dispatch:

jobs:
  Set-repos:
    name: "Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Print repos.json"
        run: cat ${{ env.CONFIGURATION }}

      - name: "Generate Matrix"
        id: generate-matrix
        run: |
          echo "repos=$(jq -c . < ${{ env.CONFIGURATION }})" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "Build kernel"
    runs-on: ubuntu-latest
    needs:
      - Set-repos
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      kernelDir: ${{ matrix.repos.kernelSource.name }}_${{ matrix.repos.kernelSource.device }}
      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.device }}_defconfig
      withKernelSU: ${{ matrix.repos.withKernelSU }}

    steps:
      - name: "Create working dir"
        run: mkdir -p ${{ env.kernelDir }}

      - name: "Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip ftp gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lftp zstd wget libfl-dev python3 libarchive-tools jq

      - name: "Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch ${{ env.kernelBranch }} ${{ env.kernelRepo }} ${{ env.kernelName }} --depth=1

      - name: "💫 Get toolchains"
        id: toolchains
        working-directory: ./${{ env.kernelDir }}
        run: |
          # Read the JSON from the environment variable (already quoted by GitHub)
          toolchains='${{ env.toolchains }}'
          # Validate JSON (helps catch malformed entries early)
          echo "$toolchains" | jq . > /dev/null || { echo "❌ Invalid JSON in toolchains"; exit 1; }

          for idx in $(seq 0 $(($(echo "$toolchains" | jq 'length') - 1))); do
            name=$(echo "$toolchains" | jq -r ".[$idx].name")
            repo=$(echo "$toolchains" | jq -r ".[$idx].repo")
            branch=$(echo "$toolchains" | jq -r ".[$idx].branch")
            echo "→ Cloning $name ($branch) into ./$name"
            git clone --recursive --branch "$branch" "$repo" "$name" --depth=1
            echo "$(pwd)/$name" >> $GITHUB_PATH
            echo "$(pwd)/$name/bin" >> $GITHUB_PATH
          done

          echo "PATH Variable: $PATH"
          
      - name: "😎 Set args"
        id: generate-args
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          params: ${{ toJSON(matrix.repos.params) }}
          extraParams: ${{ toJSON(matrix.repos.extraParams) }}
          OUT_DIR: ${{ env.OUT_DIR }}
        run: |
          set -euo pipefail

          # Parse params (they are already a JSON string)
          arch=$(jq -r '.ARCH' <<< "$params")
          cross=$(jq -r '.CROSS_COMPILE' <<< "$params")
          cross_compat=$(jq -r '.CROSS_COMPILE_COMPAT' <<< "$params")
          clang_triple=$(jq -r '.CLANG_TRIPLE' <<< "$params")
          ar=$(jq -r '.AR' <<< "$params")
          cc=$(jq -r '.CC' <<< "$params")

          # Export ARCH for later steps (workflow‑wide)
          echo "ARCH=$arch" >> $GITHUB_ENV

          # Base arguments
          args="-j$(nproc --all) O=$(pwd)/$OUT_DIR"

          # Append non‑null values
          [[ "$arch" != "null" ]] && args="$args ARCH=$arch"
          [[ "$cross" != "null" ]] && args="$args CROSS_COMPILE=$cross"
          [[ "$cross_compat" != "null" ]] && args="$args CROSS_COMPILE_ARM32=$cross_compat"
          [[ "$clang_triple" != "null" ]] && args="$args CLANG_TRIPLE=$clang_triple"
          [[ "$ar" != "null" ]] && args="$args AR=$ar"
          [[ "$cc" != "null" ]] && args="$args CC=$cc"

          # Extra params (if any)
          if [[ "$extraParams" != "null" && "$extraParams" != "{}" ]]; then
            extra=$(jq -r 'to_entries[] | select(.value != "") | "\(.key)=\(.value)"' <<< "$extraParams" | tr '\n' ' ' | sed 's/ $//')
            args="$args $extra"
          fi

          echo "args=$args" >> $GITHUB_OUTPUT
          echo "🧭 Generated args: $args"

      - name: "Make defconfig"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          # The O=... part in $args already points to $OUT_DIR
          make ${{ env.args }} ${{ env.DEFCONFIG_NAME }}

      - name: "Apply Overlay Configs"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}
        run: |
          # Example overlay – adjust as needed for NetHunter
          echo "CONFIG_OF_CONFIGFS=y" >> .config
          echo "CONFIG_OF_OVERLAY=y"   >> .config
          # Go back to source root and run olddefconfig (still using O=...)
          cd ..
          make ${{ env.args }} olddefconfig
          
      - name: "Build kernel"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          # The O=. part is already in $args, but we are already inside out/
          make ${{ env.args }}

      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ env.kernelDevice }}
          path: |
            ./${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
            ./${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz
            ./${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb
            ./${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img
          if-no-files-found: ignore
          retention-days: 7

            - name: "📦 Package with AnyKernel3"
        working-directory: ./${{ env.kernelDir }}
        run: |
          echo "Cloning AnyKernel3..."
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel

          # -----------------------------------------------------------------
          # Copy the built kernel image (now under $kernelDir/$kernelName/$OUT_DIR)
          # -----------------------------------------------------------------
          KERNEL_IMG="./${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image"
          if [[ -f "$KERNEL_IMG" ]]; then
            cp "$KERNEL_IMG" anykernel/
            echo "✔ Copied kernel: $KERNEL_IMG"
          else
            echo "❌ Kernel image not found at $KERNEL_IMG"
            exit 1
          fi

          # Optionally copy dtb/dtbo if you built them
          DTB_DIR="./${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb"
          if [[ -d "$DTB_DIR" ]]; then
            cp -r "$DTB_DIR" anykernel/dtb/
          fi

          cd anykernel

          # -------------------------------------------------------------
          # Minimal AnyKernel3 tweaks – keep the device codename correct
          # -------------------------------------------------------------
          sed -i 's/kernel.string=.*/kernel.string=Custom NetHunter Kernel/g' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=0/g' anykernel.sh
          # Use the correct device names (gta4xwifi is the codename)
          sed -i 's/device.name1=.*/device.name1=gta4xwifi/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=gta4xl/g' anykernel.sh
          sed -i 's|^block=.*|block=auto|g' anykernel.sh

          echo "Zipping up AnyKernel3 package..."
          zip -r9 ../AnyKernel3-gta4xlwifi-NetHunter.zip * -x .git README.md *placeholder

          echo "✅ AnyKernel3 zip ready: AnyKernel3-gta4xlwifi-NetHunter.zip"
          path: ./${{ env.kernelDir }}/AnyKernel3-gta4xlwifi-NetHunter.zip

